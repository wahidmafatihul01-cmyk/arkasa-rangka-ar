<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ARKASA • Rangka Manusia</title>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#101a30; color:#fff; font-family:Arial,sans-serif; }
    #intro { position:fixed; z-index:10; top:10px; left:10px; right:10px; padding:12px 14px; border-radius:12px; background:rgba(9,20,43,.92); line-height:1.4; }
    #intro strong { color:#ffe36e; }
    #status { font-size:13px; margin-top:5px; }
    #start { display:block; margin-top:10px; padding:10px 14px; border:0; border-radius:8px; background:#ffcf38; color:#111; font-weight:bold; font-size:16px; }
    #start[hidden] { display:none; }
    #error { color:#ffd0d0; font-size:13px; white-space:pre-wrap; margin-top:6px; }
    a-scene { position:fixed; inset:0; }
    .a-enter-vr { display:none !important; }
    #cameraFallback { position:fixed; bottom:10px; left:10px; right:10px; z-index:11; font-size:12px; opacity:.8; }
  </style>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <div id="intro">
    <strong>ARKASA • Rangka Manusia</strong><br>
    Arahkan kamera ke kartu Rangka Manusia. Pastikan kartu terlihat utuh dan pencahayaan cukup.
    <div id="status">Tekan tombol Mulai AR untuk mengaktifkan kamera.</div>
    <button id="start" type="button">Mulai AR / Aktifkan Kamera</button>
    <div id="error" role="status"></div>
  </div>
  <div id="cameraFallback">Jika kamera tidak muncul, izinkan kamera di pengaturan situs lalu muat ulang.</div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: yes; uiError: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>
    <a-assets timeout="20000">
      <a-asset-item id="skeletonModel" src="./model-rangka.glb"></a-asset-item>
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false" cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-camera>
    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model src="#skeletonModel" position="0 0 0.1" rotation="0 0 0" scale="0.25 0.25 0.25"></a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const startBtn = document.getElementById('start');
    const sceneEl = document.getElementById('scene');

    function showError(message) {
      errorEl.textContent = message;
      statusEl.textContent = 'AR belum berhasil dimulai.';
      startBtn.hidden = false;
    }

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      startBtn.textContent = 'Memulai...';
      errorEl.textContent = '';
      statusEl.textContent = 'Meminta akses kamera...';

      try {
        if (!window.isSecureContext) {
          throw new Error('Halaman tidak dibuka dalam konteks HTTPS yang aman.');
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('Browser ini tidak menyediakan akses kamera. Coba buka tautan dengan Google Chrome.');
        }
        // Test browser camera permission first, then release the stream so MindAR can use it.
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: 'environment' } }
        });
        stream.getTracks().forEach(track => track.stop());

        statusEl.textContent = 'Akses kamera tersedia. Memulai AR...';
        const arSystem = sceneEl.systems['mindar-image-system'];
        if (!arSystem) throw new Error('Komponen MindAR belum termuat. Periksa koneksi internet lalu muat ulang.');
        await arSystem.start();
        statusEl.textContent = 'Kamera dimulai. Arahkan kamera ke kartu.';
        startBtn.hidden = true;
      } catch (err) {
        console.error(err);
        let message = err && err.message ? err.message : String(err);
        if (err && err.name === 'NotAllowedError') message = 'Izin kamera ditolak. Buka setelan situs di Chrome, izinkan Kamera, lalu muat ulang.';
        if (err && err.name === 'NotFoundError') message = 'Kamera tidak ditemukan pada perangkat ini.';
        if (err && err.name === 'NotReadableError') message = 'Kamera sedang dipakai aplikasi lain. Tutup aplikasi kamera lain lalu coba lagi.';
        showError(message);
      } finally {
        startBtn.disabled = false;
        startBtn.textContent = 'Coba Mulai AR Lagi';
      }
    });

    sceneEl.addEventListener('arReady', () => {
      statusEl.textContent = 'AR siap. Arahkan kamera ke kartu.';
    });
    sceneEl.addEventListener('arError', (event) => {
      console.error('MindAR error', event);
      showError('MindAR gagal menjalankan kamera. Periksa izin kamera dan koneksi internet, lalu tekan Coba Mulai AR Lagi.');
    });
    sceneEl.addEventListener('targetFound', () => {
      statusEl.textContent = 'Kartu dikenali! Model 3D sedang ditampilkan.';
    });
    sceneEl.addEventListener('targetLost', () => {
      statusEl.textContent = 'Kartu tidak terlihat. Arahkan kamera kembali ke kartu.';
    });
  </script>
</body>
</html>
